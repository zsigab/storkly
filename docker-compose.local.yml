# Local development stack — rootless Podman compatible (all ports >= 1024).
# Run: podman compose -f docker-compose.local.yml up -d
#
# App:      http://localhost:3000   (frontend via Caddy)
# API:      http://localhost:8081   (direct, bypasses Caddy)
# Mail UI:  http://localhost:8025

services:
  caddy:
    container_name: storkly-caddy
    image: caddy:2-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro,z
      - ./frontend/dist:/srv/frontend:ro,z
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: storkly-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/storkly
      SPRING_DATASOURCE_USERNAME: storkly
      SPRING_DATASOURCE_PASSWORD: storkly
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      STORKLY_CAPTCHA_SECRET_KEY: "1x0000000000000000000000000000000AA"
      STORKLY_JWT_SECRET: "local-dev-secret-please-change-for-real-deployments"
      STORKLY_SEED_DATA: "true"
      IMAGES_DIR: /app/uploads
      STORKLY_MAIL_FRONTEND_URL: "http://localhost:3000"
      STORKLY_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-not-configured}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-not-configured}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
    volumes:
      - uploads_data_local:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: storkly-postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: storkly
      POSTGRES_USER: storkly
      POSTGRES_PASSWORD: storkly
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storkly -d storkly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    container_name: storkly-mailpit
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  pg_data_local:
  uploads_data_local:
