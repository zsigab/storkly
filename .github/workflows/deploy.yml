name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (e.g. sha-f993ad8 or 2026-05-10)
        default: latest
        required: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd /opt/storkly
            docker compose pull
            docker compose up -d
        env:
          IMAGE_TAG: ${{ inputs.tag }}
