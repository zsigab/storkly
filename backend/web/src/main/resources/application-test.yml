spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid,email,profile
          facebook:
            client-id: test-facebook-client-id
            client-secret: test-facebook-client-secret
            scope: email,public_profile
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email

storkly:
  captcha:
    enabled: false
    secret-key: "test-turnstile-key"
  mail:
    from: noreply@storkly.test
    frontend-url: http://localhost:5173
  jwt:
    secret: "test-secret-key-must-be-at-least-32-characters-long-for-hmac"
    access-token-expiry: PT15M
    refresh-token-expiry: P7D
  cookie:
    secure: false
  cors:
    allowed-origins:
      - http://localhost:5173

logging:
  console:
    enabled: false
