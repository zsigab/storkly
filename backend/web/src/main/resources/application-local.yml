server:
  port: 8081

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
            redirect-uri: http://localhost:8081/login/oauth2/code/google
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:not-configured}
            client-secret: ${FACEBOOK_CLIENT_SECRET:not-configured}
            scope: email,public_profile
            redirect-uri: http://localhost:8081/login/oauth2/code/facebook
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
  datasource:
    url: jdbc:postgresql://localhost:5432/storkly
    username: storkly
    password: storkly
    driver-class-name: org.postgresql.Driver
  task:
    execution:
      pool:
        core-size: 2
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      "[mail.smtp.auth]": "false"
      "[mail.smtp.starttls.enable]": "false"

storkly:
  facebook:
    app-secret: ${FACEBOOK_CLIENT_SECRET:not-configured}
  images:
    upload-dir: ${IMAGES_DIR:${user.home}/.storkly/uploads}
  captcha:
    enabled: true
    secret-key: "1x0000000000000000000000000000000AA"
  jwt:
    secret: "local-development-secret-key-change-in-production-must-be-long"
    access-token-expiry: PT1H
    refresh-token-expiry: P1D
    remember-me-token-expiry: P90D
  mail:
    frontend-url: http://localhost:5173
  cookie:
    secure: false
  cors:
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    app.storkly: DEBUG
    org.jooq.tools.LoggerListener: DEBUG
