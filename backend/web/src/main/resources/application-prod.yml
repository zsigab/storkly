spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            redirect-uri: https://storkly.cc/login/oauth2/code/google
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email,public_profile
            redirect-uri: https://storkly.cc/login/oauth2/code/facebook
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
  datasource:
    url: jdbc:postgresql://db:5432/storkly
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_USERNAME}
    password: ${BREVO_PASSWORD}
    properties:
      "[mail.smtp.auth]": "true"
      "[mail.smtp.starttls.enable]": "true"

storkly:
  captcha:
    enabled: true
    secret-key: ${TURNSTILE_SECRET_KEY}
  mail:
    frontend-url: https://storkly.cc
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: PT1H
    refresh-token-expiry: P7D
  cookie:
    secure: true
  cors:
    allowed-origins:
      - https://storkly.cc

logging:
  level:
    app.storkly: INFO
