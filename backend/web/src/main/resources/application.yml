spring:
  application:
    name: storkly
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    properties:
      "[mail.smtp.auth]": "true"
      "[mail.smtp.starttls.enable]": "true"
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
    cache-names: linkPreview
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  shutdown: graceful

management:
  tracing:
    export:
      enabled: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

storkly:
  mail:
    from: noreply@storkly.cc
  images:
    upload-dir: ${IMAGES_DIR:./uploads}
    max-size-mb: 5
