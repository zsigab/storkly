[versions]
springBoot = "4.1.0-M4"
springDependencyManagement = "1.1.7"
jooq = "3.21.1"
flyway = "11.8.2"
lombok = "1.18.38"
testcontainers = "1.21.3"
spotless = "7.0.4"
jspecify = "1.0.0"
postgresql = "42.7.5"
springdoc = "3.0.2"
jjwt = "0.12.6"
playwright = "1.49.0"
jsoup = "1.18.3"

[libraries]
# Spring Boot starters (versions managed by Spring BOM at runtime)
springBootStarter           = { module = "org.springframework.boot:spring-boot-starter",            version.ref = "springBoot" }
springBootStarterWeb        = { module = "org.springframework.boot:spring-boot-starter-web",        version.ref = "springBoot" }
springBootStarterSecurity   = { module = "org.springframework.boot:spring-boot-starter-security",   version.ref = "springBoot" }
springBootStarterMail       = { module = "org.springframework.boot:spring-boot-starter-mail",       version.ref = "springBoot" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
springBootStarterJooq       = { module = "org.springframework.boot:spring-boot-starter-jooq",       version.ref = "springBoot" }
springBootStarterFlyway     = { module = "org.springframework.boot:spring-boot-starter-flyway",     version.ref = "springBoot" }
springBootStarterOauth2Client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client", version.ref = "springBoot" }
springBootStarterTest       = { module = "org.springframework.boot:spring-boot-starter-test",       version.ref = "springBoot" }
springBootTestcontainers    = { module = "org.springframework.boot:spring-boot-testcontainers",     version.ref = "springBoot" }

# JOOQ
jooq               = { module = "org.jooq:jooq",                 version.ref = "jooq" }
jooqMetaExtensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }

# Database
flywayCore     = { module = "org.flywaydb:flyway-core",                   version.ref = "flyway"       }
flywayPostgres = { module = "org.flywaydb:flyway-database-postgresql",     version.ref = "flyway"       }
postgresql     = { module = "org.postgresql:postgresql",                   version.ref = "postgresql"   }

# OpenAPI / Springdoc
springdocWebmvcUi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Spring Security (version managed by Spring BOM)
springSecurityCore = { module = "org.springframework.security:spring-security-core" }
springWeb          = { module = "org.springframework:spring-web" }
springTx           = { module = "org.springframework:spring-tx" }
# JWT
jjwtApi    = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwtImpl   = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwtJackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Scraping
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
jsoup      = { module = "org.jsoup:jsoup",                     version.ref = "jsoup"      }

# Utilities
lombok      = { module = "org.projectlombok:lombok",         version.ref = "lombok"   }
jspecify    = { module = "org.jspecify:jspecify",            version.ref = "jspecify" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.83" }

# Testcontainers
testcontainersPostgres = { module = "org.testcontainers:postgresql",   version.ref = "testcontainers" }
testcontainersJunit    = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
springBoot                 = { id = "org.springframework.boot",        version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless                   = { id = "com.diffplug.spotless",           version.ref = "spotless" }
jooqCodegen                = { id = "org.jooq.jooq-codegen-gradle",   version.ref = "jooq" }
