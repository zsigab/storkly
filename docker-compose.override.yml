# Used for local Colima (preprod) testing.
# Run: docker compose up -d
# API:      http://localhost:8080
# Mail UI:  http://localhost:8025
services:
  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  api:
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/storkly
      SPRING_DATASOURCE_USERNAME: storkly
      SPRING_DATASOURCE_PASSWORD: storkly
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      STORKLY_CAPTCHA_SECRET_KEY: "1x0000000000000000000000000000000AA"
      STORKLY_JWT_SECRET: "colima-local-dev-secret-please-change-for-real-deployments"
    ports:
      - "8080:8080"
    env_file: []

  db:
    environment:
      POSTGRES_DB: storkly
      POSTGRES_USER: storkly
      POSTGRES_PASSWORD: storkly
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
